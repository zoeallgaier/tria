<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light dark" />
  <title>Tria admin</title>
  <link rel="icon" href="../icons/icon-32.png?v=1289" />
  <link rel="apple-touch-icon" href="../icons/icon-180.png?v=1289" />
  <link rel="stylesheet" href="../css/tokens.css?v=1289" />
  <link rel="stylesheet" href="admin.css?v=1289" />
</head>
<body>
  <!-- The admin dashboard. Not the app: never bundled into iOS (ios-sync.sh
       copies only the root index.html), and served by GitHub Pages as a real
       folder, so it never falls to 404.html's app shell. Its data comes from
       supabase/admin-dashboard.sql and admin-extras.sql's admin_* functions,
       which refuse anyone not in public.admins.

       Tria's own layout (Zoe): the inset glass rail on a desktop, the floating
       glass capsule and a top bar with a back chevron on a phone. -->
  <div class="wash" aria-hidden="true"></div>

  <aside class="rail" id="rail" aria-label="Sections" hidden>
    <a class="brand" href="../#/profile" aria-label="Back to Tria"><span class="wordmark"></span><span class="brand-sub">admin</span></a>
    <nav class="rail-list" id="rail-list"></nav>
    <div class="rail-foot">
      <p class="asof" id="asof"></p>
      <a class="pill-quiet rail-back" href="../#/profile"><span class="face" id="face" aria-hidden="true"></span><span>Back to Tria</span></a>
    </div>
  </aside>

  <header class="bar" id="bar">
    <a class="bar-btn bar-back" id="bar-back" href="../#/profile" aria-label="Back to Tria"></a>
    <p class="bar-title" id="bar-title" aria-hidden="true"></p>
    <button class="bar-btn" id="refresh" type="button" aria-label="Refresh" title="Refresh" hidden></button>
  </header>

  <main id="main" class="main" aria-live="polite"></main>

  <nav class="dock" id="dock" aria-label="Sections" hidden><div class="dock-pill" id="dock-pill"></div></nav>
  <div class="hovercard" id="tooltip" role="status" hidden></div>

  <script src="../js/vendor/supabase-js-2.110.9.min.js?v=1289"></script>
  <script src="../js/config.js?v=1289"></script>
  <script src="dictionary.js?v=1289"></script>
  <script src="admin.js?v=1289"></script>
</body>
</html>
