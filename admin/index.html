<body>
  <!-- The admin dashboard. Not the app: never bundled into iOS (ios-sync.sh
       copies only the root index.html), and served by GitHub Pages as a real
       folder, so it never falls to 404.html's app shell. Its data comes from
       supabase/admin-dashboard.sql and admin-extras.sql's admin_* functions,
       which refuse anyone not in public.admins.

       Laid out to Apple's HIG in Tria's materials: a large title that hands
       over to the bar's inline one as it scrolls under, a tab bar on a phone
       and a sidebar from 900px, segmented controls, inset grouped lists,
       44pt targets. -->
  <div class="wash" aria-hidden="true"></div>

  <aside class="side" id="side" aria-label="Sections" hidden>
    <a class="side-mark" href="../" aria-label="Tria"><span class="wordmark"></span><span class="mark-sub">admin</span></a>
    <nav class="side-list" id="side-list"></nav>
    <div class="side-foot">
      <p class="side-asof" id="side-asof"></p>
      <button class="side-row" id="side-out" type="button"></button>
    </div>
  </aside>

  <header class="nav" id="nav">
    <div class="nav-row">
      <a class="nav-mark" href="../" aria-label="Tria"><span class="wordmark"></span></a>
      <p class="nav-title" id="nav-title" aria-hidden="true"></p>
      <div class="nav-acts">
        <button class="nav-btn" id="refresh" type="button" aria-label="Refresh" title="Refresh" hidden></button>
        <button class="nav-btn nav-out" id="sign-out" type="button" aria-label="Log out" title="Log out" hidden></button>
      </div>
    </div>
  </header>

  <main id="main" class="main" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar" aria-label="Sections" hidden></nav>
  <div class="hovercard" id="tooltip" role="status" hidden></div>

  <script src="../js/config.js?v=1248"></script>
  <script src="dictionary.js?v=1248"></script>
  <script src="admin.js?v=1248"></script>
</body>
</html>
