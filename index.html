<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- CLEAN URLS ON A HOST WITH NO SERVER.
       A shared link is `/p/<id>`, not `/#/p/<id>`. The part after the # never
       leaves the device — browsers don't send it — so a hash link is the same
       request as the bare homepage, which is why every Tria link unfurls as the
       same card and why Universal Links can't tell one page from another (Apple
       matches on the path, and the path of `/#/p/x` is just `/`).

       GitHub Pages has no server to route with, but it serves 404.html for any
       path that isn't a real file. So 404.html is a BYTE COPY of this file
       (bump.sh makes it) — the 404 response body IS the app, it boots once at
       the clean URL, and there is no redirect and no second load. `cp` and not
       a transform is the point: a generated file that differs from its source
       drifts the first time someone edits one of them, and a drifted shell
       boots a stale build on exactly the paths people share.

       <base> is what makes the copy work. Every asset line below is relative,
       and served at /p/<id> they'd resolve to /p/css/app.css and 404. It also
       fixes the self-updater, which fetches 'index.html' and would otherwise
       ask for /p/index.html and quietly never find a new build.

       AT THE ROOT IT COMES OUT AGAIN, because there it is not the no-op it
       looks like. <base> resolves EVERY relative URL, `#/p/<id>` included, and
       a fragment link only stays in the same document when it resolves to the
       document's own URL plus a hash. Two roots don't: the app's, where WebKit
       holds the document at `capacitor://localhost` with no slash while
       `location.pathname` answers "/", and any web root carrying a query (the
       self-updater's `?u=`, an OAuth `?code=`). Under the base a post link
       there resolved to `…/#/p/<id>`, a DIFFERENT document, so the first tap
       on one after every launch reloaded the whole app: boot splash and a
       fresh Store.init. `location.replace('#/…')` did the same, and back from
       there swapped in the launch document from WebKit's page cache, frozen as
       it was, rather than routing. Measured in the simulator, 2026-09-25.
       Without the base a root resolves everything exactly as it did before
       clean URLs, and index.html and 404.html stay identical.

       Runs before the stylesheets so nothing is ever requested from the wrong
       place, and replaceState rather than assignment so there's no history
       entry to go "back" into. A path we don't know lands on the app's own
       default rather than sitting at an address that means nothing. After the
       rewrite a clean path's document sits at `/#/…` with no query, which is
       exactly what the base resolves to, so there it stays. -->
  <base href="/" />
  <script>
    (function () {
      var p = location.pathname;
      if (p === '/' || p === '/index.html') {
        var b = document.querySelector('base');
        if (b) b.parentNode.removeChild(b);
        return;
      }
      var m = p.match(/^\/(p|u|daily|i)\/(.+?)\/?$/);
      // The query rides INSIDE the hash, because that's where the router reads
      // it from (`#/p/<id>?pane=likers`). A `?s=` source tag lands there too and
      // is simply ignored by a route that doesn't know it.
      var h = m ? '#/' + m[1] + '/' + m[2] + location.search : (location.hash || '#/');
      history.replaceState(null, '', '/' + h);
    })();
  </script>

  <title>Tria</title>
  <meta name="description" content="Social media made local. A quiet place for small circles of friends." />

  <!-- Link preview (Open Graph + Twitter). Without these, the iOS/Android share
       sheet and Messages/social unfurls fall back to a generic globe glyph; an
       absolute og:image points them at the Tria app icon instead. Absolute URLs
       are required — LinkPresentation fetches them over the network, so they
       can't be relative. Domain matches CNAME (triaonline.com). -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Tria" />
  <meta property="og:title" content="Tria" />
  <meta property="og:description" content="Social media made local. A quiet place for small circles of friends." />
  <meta property="og:url" content="https://triaonline.com/" />
  <meta property="og:image" content="https://triaonline.com/icons/icon-512.png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Tria" />
  <meta name="twitter:description" content="Social media made local. A quiet place for small circles of friends." />
  <meta name="twitter:image" content="https://triaonline.com/icons/icon-512.png" />

  <!-- Smart App Banner: Safari draws its own "OPEN / VIEW" strip above the page
       for this App Store id. Web only, and only on iPhone — it is invisible in
       the bundled app (which never loads a triaonline.com URL) and invisible on
       desktop. It is the one thing that catches a reader who followed a link
       without the app: Universal Links hand them straight over when it's
       installed, and this is what's there when it isn't. -->
  <meta name="apple-itunes-app" content="app-id=6796104809" />

  <meta name="theme-color" content="#edeef0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e1012" media="(prefers-color-scheme: dark)" />

  <!-- First-paint background. The self-updater reloads by navigating to a fresh
       document (see app.js), which repaints the browser default (white) until
       the external CSS lands — a flash, worst in dark mode. Inline the --bg
       token + color-scheme here (parsed before the stylesheets) so the very
       first paint is already on-brand paper/ink. Keep these hexes in sync with
       --bg in css/tokens.css. -->
  <meta name="color-scheme" content="light dark" />
  <style>
    html { background: #edeef0; }
    @media (prefers-color-scheme: dark) { html { background: #0e1012; } }
  </style>

  <!-- Installable web app (bookmark / add-to-home-screen), and the tab's
       favicon. Every tile is the SPLASH, baked: icons/wordmark.svg as a mask
       with the brand band at rest painted through it, centred at 80% of the
       tile on Tria's own paper. So the tab, the home screen, the app icon and
       the curtain the app opens on are one picture at five sizes, and the logo
       cannot drift between them — re-render them all from the wordmark
       together, never one by one.
       Every icon here is opaque, and must stay that way: shipping them with a
       transparent background (tried in v=291) does NOT let iOS supply a
       light/dark plate — iOS composites apple-touch-icon transparency onto
       BLACK, so light mode got a black tile. The iOS 18 light/dark/tinted icon
       system is asset-catalog only and there is no link or manifest hook that
       reaches a web app icon, so a scheme-aware home screen icon isn't
       available to us at all. Baked paper is the whole fix.
       The favicon sits a shade wider (84%) because 32px has no room to waste,
       and the maskable narrower (66%) because a wordmark's DIAGONAL is what has
       to clear Android's 80% safe circle. -->
  <link rel="manifest" href="site.webmanifest" />
  <link rel="icon" href="icons/icon-32.png?v=670" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/icon-192.png?v=670" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=670" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Tria" />
  <!-- Transparent status bar in the installed (homescreen) app: the web view
       runs edge-to-edge UNDER the status bar (liquid-glass), rather than iOS
       reserving an opaque strip. Content clears the notch via the
       env(safe-area-inset-top) padding on .topbar / main. The toolbar's own
       frosted band sits under the clock while it's painted; it isn't at the top
       of a page (the scroll edge effect) and it's gone once you scroll down, so
       the .statusbar-scrim below is what keeps the glyphs legible in both. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Fonts are SELF-HOSTED (css/fonts/, declared in tokens.css). They used to
       come from fonts.googleapis.com, which cost a DNS + TLS handshake to two
       third-party hosts and then a second, render-blocking stylesheet before a
       single glyph could be requested — and in the bundled iOS app it meant the
       app's own typography waited on the network at every cold launch, falling
       back to system type when there wasn't one. All ten faces together are
       112KB, less than one post photo. Preload the two that set the first
       screen (Oxygen 400 body, Instrument Serif titles); the other eight are
       found in the CSS as usual. crossorigin is REQUIRED on a font preload even
       same-origin, or the fetch is made twice. -->
  <link rel="preload" href="css/fonts/oxygen-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="css/fonts/instrument-serif-400-latin.woff2" as="font" type="font/woff2" crossorigin>

  <!-- The ?v= stamp busts HTTP caches on deploy AND drives the self-updater in
       app.js (it refetches this file and reloads when the stamp changes).
       BUMP THE SAME NUMBER ON EVERY LINE whenever any css/js file changes. -->
  <link rel="stylesheet" href="css/tokens.css?v=670" />
  <link rel="stylesheet" href="css/app.css?v=670" />
</head>

<body>
  <!-- Boot splash: static HTML so it paints before any JS or network work.
       The logo (icons/wordmark.svg, a mask) wears Tria's four-stop brand ramp,
       turning — a full pass through the colours every second. Two elements
       because the rise blurs and the mask must not (see .splash-t in app.css).
       app.js fades it out once the first view is in (see dismissSplash). -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-t"><div class="wordmark splash-ramp"></div></div>
  </div>

  <a href="#main" class="skip-link">Skip to main content</a>


  <!-- Ambient wash: a soft radial glow behind everything, giving the page
       background depth. Its colour is on-brand by default, and tinted from a
       profile's photo when you're viewing one (see applyAmbient in app.js). -->
  <div class="ambient" aria-hidden="true"></div>

  <!-- Toolbar: fixed top on every breakpoint, and the page's own — a leading
       back chevron (most pages have none; the tab bar already says where you
       are), a centered small title, and the page's actions as glass buttons.
       The standard HIG collapsing-title bar. Every signed-in page fills these
       three slots from mountToolbar() (js/app.js); signed out the bar isn't
       drawn at all (body.gate) and .auth-topbar carries the wordmark instead.

       A `<a class="brand">tria</a>` sat here until 1.3 finished. It was the
       pre-1.3 content — the app's name where the page's name belongs, which is
       the whole thing this release set out to fix — and it survived the
       migration as the fallback for a page that hadn't been converted yet.
       There are none left, so it went: see resetToolbar in app.js.

       #toolbar-title is aria-hidden: it's a decorative echo of the page's real,
       in-flow <h1> (mastheadEl, or a profile's own name), invisible until that
       one scrolls out from under the bar (see syncToolbarTitle), so it must
       never be a second accessible heading with the same name. -->
  <header class="topbar">
    <div class="toolbar-page" id="toolbar-page" hidden></div>
    <div class="toolbar-title" id="toolbar-title" aria-hidden="true"></div>
    <div class="toolbar-actions" id="toolbar-actions"></div>
  </header>

  <!-- Legibility scrim for the iOS status bar. black-translucent (above) forces
       the clock/battery to draw WHITE over our content; in light mode the pale
       page behind them washes them out. A soft dark-to-transparent gradient over
       only the safe-area strip (no solid bar) keeps them readable — iOS's own
       trick. Rendered in any INSTALLED shell — the App Store build included,
       which is the one it used to miss (see installedShell in app.js, which
       stamps html[data-shell] for the stylesheet to read). Deepens once the
       topbar tucks away and bare content scrolls under the glyphs. -->
  <div class="statusbar-scrim" aria-hidden="true"></div>

  <!-- Speed-dial veil: blurs and dims the page while the phone + button fans
       out its post-type menu. Sits between topbar and nav in the DOM so it
       stacks over the bar but under the dial (all three share z-index 100). -->
  <div class="dial-veil" id="dial-veil" hidden></div>

  <!-- Nav lives OUTSIDE the (backdrop-filtered) topbar so its mobile
       fixed-to-bottom positioning anchors to the viewport, not the bar.
       Desktop: top-right of the bar. Mobile: bottom tab bar. Filled by app.js. -->
  <nav class="nav" id="nav" aria-label="Primary"></nav>

  <!-- The comment bar, on a post's page only. It sits out here beside the nav
       rather than inside the page for the reason the nav does: a fixed bottom
       bar has to anchor to the VIEWPORT, and any page ancestor that ever grows a
       transform or containment would quietly make itself its containing block
       instead. Filled by mountPostBar, emptied by resetPostBar on every
       navigation — the same contract the toolbar has. On phones it replaces the
       nav outright; on desktop the sidebar is nowhere near it and stays. -->
  <div class="postbar" id="postbar" hidden></div>

  <main id="main" tabindex="-1">
    <!-- Views are rendered here by the router in app.js. -->
    <div id="view"></div>
  </main>

  <!-- supabase-js is VENDORED, not pulled from a CDN. store.js calls
       createClient at parse time, so nothing in Tria — not the router, not the
       gate — runs until this file lands. Off jsdelivr that put a third-party
       DNS + TLS handshake on the critical path of every cold launch, and in the
       bundled iOS app it meant no network was not a slow launch but a blank
       screen, which is both a 2.1 rejection and the worst first run possible.
       Local also PINS the version: the old src said `@2`, so any minor release
       shipped itself into production without a deploy. Update deliberately —
       drop a new file in, change this line, bump. -->
  <script src="js/vendor/supabase-js-2.110.9.min.js?v=670"></script>
  <!-- The QR encoder, before storycard.js, which picks it up off `window` if it
       is there and draws a labelled plate in its place if it isn't. Both are
       ahead of app.js because app.js reads `window.StoryCard` to decide whether
       to offer the card row at all. -->
  <script src="js/vendor/qr.js?v=670"></script>
  <script src="js/storycard.js?v=670"></script>
  <script src="js/config.js?v=670"></script>
  <script src="js/store.js?v=670"></script>
  <script src="js/app.js?v=670"></script>
</body>

</html>
