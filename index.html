<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tria</title>
  <meta name="description" content="Social media made local. A quiet place for small circles of friends." />

  <!-- Link preview (Open Graph + Twitter). Without these, the iOS/Android share
       sheet and Messages/social unfurls fall back to a generic globe glyph; an
       absolute og:image points them at the Tria app icon instead. Absolute URLs
       are required — LinkPresentation fetches them over the network, so they
       can't be relative. Domain matches CNAME (triaonline.com). -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Tria" />
  <meta property="og:title" content="Tria" />
  <meta property="og:description" content="Social media made local. A quiet place for small circles of friends." />
  <meta property="og:url" content="https://triaonline.com/" />
  <meta property="og:image" content="https://triaonline.com/icons/icon-512.png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Tria" />
  <meta name="twitter:description" content="Social media made local. A quiet place for small circles of friends." />
  <meta name="twitter:image" content="https://triaonline.com/icons/icon-512.png" />

  <meta name="theme-color" content="#edeef0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e1012" media="(prefers-color-scheme: dark)" />

  <!-- First-paint background. The self-updater reloads by navigating to a fresh
       document (see app.js), which repaints the browser default (white) until
       the external CSS lands — a flash, worst in dark mode. Inline the --bg
       token + color-scheme here (parsed before the stylesheets) so the very
       first paint is already on-brand paper/ink. Keep these hexes in sync with
       --bg in css/tokens.css. -->
  <meta name="color-scheme" content="light dark" />
  <style>
    html { background: #edeef0; }
    @media (prefers-color-scheme: dark) { html { background: #0e1012; } }
  </style>

  <!-- Installable web app (bookmark / add-to-home-screen). Source is
       icons/SVG/triaiconfinal.svg, a pastel disc with the t knocked clean out of
       it, centred at 80% of the tile on an opaque white plate.
       Every icon here is opaque, and must stay that way: shipping them with a
       transparent background (tried in v=291) does NOT let iOS supply a
       light/dark plate — iOS composites apple-touch-icon transparency onto
       BLACK, so light mode got a black tile. The iOS 18 light/dark/tinted icon
       system is asset-catalog only and there is no link or manifest hook that
       reaches a web app icon, so a scheme-aware home screen icon isn't
       available to us at all. Baked white is the whole fix. It also keeps the
       knockout legible: the t is a hole, so it only reads as a letter when the
       colour behind it is one we control.
       The maskable additionally sits at 78% to clear Android's 80% safe
       circle. -->
  <link rel="manifest" href="site.webmanifest" />
  <link rel="icon" href="icons/icon-32.png?v=313" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/icon-192.png?v=313" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=313" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Tria" />
  <!-- Transparent status bar in the installed (homescreen) app: the web view
       runs edge-to-edge UNDER the status bar (liquid-glass), rather than iOS
       reserving an opaque strip. Content clears the notch via the
       env(safe-area-inset-top) padding on .topbar / main. At the top the frosted
       topbar (wordmark + Post) sits under it; scroll down and the topbar tucks
       away, leaving the status area fully clear. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- The ?v= stamp busts HTTP caches on deploy AND drives the self-updater in
       app.js (it refetches this file and reloads when the stamp changes).
       BUMP THE SAME NUMBER ON EVERY LINE whenever any css/js file changes. -->
  <link rel="stylesheet" href="css/tokens.css?v=313" />
  <link rel="stylesheet" href="css/app.css?v=313" />
</head>

<body>
  <!-- Boot splash: static HTML so it paints before any JS or network work.
       The serif t wears the Post button's drifting pastel gradient; app.js
       fades it out once the first view is in (see dismissSplash). -->
  <div class="splash" id="splash" aria-hidden="true">
    <span class="splash-t">t</span>
  </div>

  <a href="#main" class="skip-link">Skip to main content</a>


  <!-- Ambient wash: a soft radial glow behind everything, giving the page
       background depth. Its colour is on-brand by default, and tinted from a
       profile's photo when you're viewing one (see applyAmbient in app.js). -->
  <div class="ambient" aria-hidden="true"></div>

  <!-- Brand bar: fixed top on every breakpoint. -->
  <header class="topbar">
    <a class="brand" href="#/about" aria-label="Tria, about">
      <span class="brand-mark">tria</span>
    </a>
    <!-- Share Tria: one tap straight to the OS share sheet (clipboard copy on
         desktop). This used to be a sprout leading to a note from Zoe that held
         the share button, which made handing Tria to a friend a two-tap errand
         through a page; the note now lives on About and the glyph does the job
         itself. Sits at the header's right edge on phones; floats top-right over
         content on desktop, where the topbar is a left rail (see .share-tria).
         The whole topbar is hidden signed-out, so this is signed-in only for
         free. The tray is inlined rather than drawn by svgIcon('send') because
         the header paints before app.js runs — the two must stay in step. -->
    <button class="share-tria" type="button" aria-label="Share Tria">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 15V3" />
        <path d="M8 6.5 12 3l4 3.5" />
        <path d="M5 10v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9" />
      </svg>
    </button>
  </header>

  <!-- Legibility scrim for the iOS status bar. black-translucent (above) forces
       the clock/battery to draw WHITE over our content; in light mode the pale
       page behind them washes them out. A soft dark-to-transparent gradient over
       only the safe-area strip (no solid bar) keeps them readable — iOS's own
       trick. Only rendered in the installed standalone shell; deepens once the
       topbar tucks away and bare content scrolls under the glyphs. -->
  <div class="statusbar-scrim" aria-hidden="true"></div>

  <!-- Speed-dial veil: blurs and dims the page while the phone + button fans
       out its post-type menu. Sits between topbar and nav in the DOM so it
       stacks over the bar but under the dial (all three share z-index 100). -->
  <div class="dial-veil" id="dial-veil" hidden></div>

  <!-- Nav lives OUTSIDE the (backdrop-filtered) topbar so its mobile
       fixed-to-bottom positioning anchors to the viewport, not the bar.
       Desktop: top-right of the bar. Mobile: bottom tab bar. Filled by app.js. -->
  <nav class="nav" id="nav" aria-label="Primary"></nav>

  <main id="main" tabindex="-1">
    <!-- Views are rendered here by the router in app.js. -->
    <div id="view"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=313"></script>
  <script src="js/store.js?v=313"></script>
  <script src="js/app.js?v=313"></script>
</body>

</html>
